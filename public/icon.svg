<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stopColor="#0284C7"/>
      <stop offset="1" stopColor="#0369A1"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop stopColor="#FDE047"/>
      <stop offset="1" stopColor="#F59E0B"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Sun Rays on top left -->
  <g stroke="url(#sun)" stroke-width="16" stroke-linecap="round">
    <line x1="80" y1="120" x2="45" y2="90" />
    <line x1="120" y1="80" x2="95" y2="35" />
    <line x1="175" y1="85" x2="190" y2="40" />
  </g>

  <!-- Robot Mascot Head Silhouette -->
  <!-- Headphones headband -->
  <path d="M165 240 C165 140 345 140 345 240" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" fill="none" opacity="0.9"/>
  <!-- Pink earpads -->
  <rect x="135" y="215" width="36" height="70" rx="18" fill="#F43F5E" />
  <rect x="340" y="215" width="36" height="70" rx="18" fill="#F43F5E" />

  <!-- Robot Face Helmet -->
  <rect x="160" y="180" width="190" height="155" rx="70" fill="#FFFFFF" />
  <!-- Dark Visor Screen -->
  <rect x="185" y="205" width="140" height="95" rx="40" fill="#0C4A6E" />

  <!-- Glowing Cyan Smiling Eyes -->
  <path d="M210 240 Q225 225 240 240" stroke="#38BDF8" stroke-width="9" stroke-linecap="round" fill="none" />
  <path d="M270 240 Q285 225 300 240" stroke="#38BDF8" stroke-width="9" stroke-linecap="round" fill="none" />
  
  <!-- Smiling Mouth -->
  <path d="M238 265 Q255 282 272 265" stroke="#38BDF8" stroke-width="7" stroke-linecap="round" fill="#38BDF8" />

  <!-- "Visitá Fray" Text Banner at bottom -->
  <text x="256" y="420" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" letter-spacing="-1">Visitá Fray</text>
  <text x="256" y="465" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-weight="800" font-size="24" fill="#BAE6FD" letter-spacing="1">GUÍA OFICIAL</text>
</svg>
